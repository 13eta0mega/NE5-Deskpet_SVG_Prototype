name: Validate character-redesign-v5 branch

on:
  push:
    branches:
      - character-redesign-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate shared SVG topology
        run: node scripts/validate-v5-model.mjs

      - name: Generate 16-state visual QA sheet
        run: node scripts/export-v5-qa.mjs

      - name: Build V5
        run: npm run build

      - name: Upload visual QA sheet
        uses: actions/upload-artifact@v4
        with:
          name: v5-visual-qa
          path: public/v5-emotion-contact-sheet.svg
