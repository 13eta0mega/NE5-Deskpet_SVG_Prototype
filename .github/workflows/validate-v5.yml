name: Validate character-redesign-v5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-v5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: character-redesign-v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build V5
        run: npm run build
